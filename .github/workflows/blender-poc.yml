name: Blender Animation Engine - Proof of Concept
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cache Ubuntu package downloads
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/.cache/apt/archives
            /home/runner/.cache/apt/lists
          key: blender-apt-${{ runner.os }}-v1
      - name: Install Blender and headless graphics runtime
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/apt/archives/partial" "$HOME/.cache/apt/lists/partial"
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/apt/archives" -o Dir::State::lists="$HOME/.cache/apt/lists" update
          sudo apt-get -o Dir::Cache::archives="$HOME/.cache/apt/archives" -o Dir::State::lists="$HOME/.cache/apt/lists" install -y --no-install-recommends blender ffmpeg
          blender --version
      - name: Render original 3D character animation
        run: |
          set -euo pipefail
          mkdir -p output rendered
          blender --background --python engine/blender_poc.py
          test -n "$(find rendered -maxdepth 1 -name 'frame_*.png' -print -quit)" || { echo 'Blender did not produce rendered frames'; exit 1; }
      - name: Assemble vertical MP4
        run: |
          set -euo pipefail
          ffmpeg -y -framerate 12 -i rendered/frame_%04d.png \
            -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p -movflags +faststart output/blender-animation-poc.mp4
      - name: Upload proof of concept
        uses: actions/upload-artifact@v4
        with:
          name: blender-animation-poc
          path: output/blender-animation-poc.mp4
          retention-days: 7
