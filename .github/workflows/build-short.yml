name: AutoShorts - Build Demo
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system tools and Arabic font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-core
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Build animated Short
        env:
          VIDEO_DURATION: "30"
        run: python -m engine.build
      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: autoshorts-demo
          path: output/autoshorts-demo.mp4
          retention-days: 7
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: autoshorts-metadata
          path: output/metadata.json
          retention-days: 7
